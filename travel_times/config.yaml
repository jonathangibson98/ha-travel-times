name: "Travel Times"
version: "1.0.4"
slug: travel_times
image: "ghcr.io/jonathangibson98/{arch}-addon-travel_times"
description: "Near real-time Waze drive-time sensors from each person to each destination."
url: "https://github.com/jonathangibson98/ha-travel-times"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:car-clock"
panel_title: "Travel Times"
homeassistant_api: true
services:
  - mqtt:want
options:
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  log_level: info
schema:
  mqtt_host: str?
  mqtt_port: int?
  mqtt_user: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)
